services:
  postgres:
    image: postgres:18
    container_name: claude-code-hub-db-3gct
    restart: unless-stopped
    ports:
      - "127.0.0.1:35432:5432"
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-claude_code_hub}
      PGDATA: /data/pgdata
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - ./data/postgres:/data
    networks:
      - claude-code-hub-net-3gct
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-claude_code_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: claude-code-hub-redis-3gct
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    networks:
      - claude-code-hub-net-3gct
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  app:
    image: ghcr.io/ding113/claude-code-hub:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: claude-code-hub-app-3gct
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT:-3000}
      DSN: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@claude-code-hub-db-3gct:5432/${DB_NAME:-claude_code_hub}
      REDIS_URL: redis://claude-code-hub-redis-3gct:6379
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-true}
      SESSION_TTL: ${SESSION_TTL:-300}
      TZ: Asia/Shanghai
      http_proxy: "http://host.docker.internal:7890"
      https_proxy: "http://host.docker.internal:7890"
      all_proxy: "socks5h://host.docker.internal:7890"
      HTTP_PROXY: "http://host.docker.internal:7890"
      HTTPS_PROXY: "http://host.docker.internal:7890"
      ALL_PROXY: "socks5h://host.docker.internal:7890"

      no_proxy: "localhost,127.0.0.1,::1,claude-code-hub-db-3gct,claude-code-hub-redis-3gct"
      NO_PROXY: "localhost,127.0.0.1,::1,claude-code-hub-db-3gct,claude-code-hub-redis-3gct"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:${APP_PORT:-3000}"
    restart: unless-stopped
    networks:
      - claude-code-hub-net-3gct
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${APP_PORT:-3000}/api/actions/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
networks:
  claude-code-hub-net-3gct:
    driver: bridge
    name: claude-code-hub-net-3gct
volumes:
    caddy_data:
    caddy_config: